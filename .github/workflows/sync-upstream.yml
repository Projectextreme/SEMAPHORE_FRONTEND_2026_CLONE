name: Sync with upstream

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/semaphore2026/SEMAPHORE_FRONTEND_2026.git
          git fetch upstream main

      - name: Sync upstream main
        run: |
          git checkout main
          git merge upstream/main --no-edit

      - name: Push changes to my fork
        run: |
          git push origin main
